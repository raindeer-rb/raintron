name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Not ubuntu-latest: Ubuntu 24.04 dropped the libwebkit2gtk-4.0-dev package
        # entirely (only the 4.1 dev headers ship now), and webview_ruby's own native
        # extension Rakefile hardcodes a `pkg-config ... webkit2gtk-4.0` query --
        # verified directly against a real failed CI run and the gem's upstream
        # source, not assumed. 22.04 is still a supported LTS (through 2027) and
        # still has the 4.0 package, so pin to it until webview_ruby targets 4.1.
        os: [ubuntu-22.04, macos-latest, windows-latest]
        ruby: ['3.3', '3.4']
    runs-on: ${{ matrix.os }}
    # Windows is best-effort, not expected to pass yet -- confirmed via a real run
    # of this exact leg, not assumed: webview_ruby attempts a Windows build (via
    # ffi-compiler's generic MinGW path), but webview.h's Windows/Edge backend
    # #includes winrt/Windows.Foundation.Collections.h, a C++/WinRT header MinGW
    # (what RubyInstaller for Windows ships) doesn't provide -- that needs MSVC +
    # the Windows SDK instead. Kept in the matrix rather than left out, so this
    # leg starts reporting green on its own the moment that gap closes upstream.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      # webview_ruby is a hard runtime dependency of this gem, so `bundle install`
      # compiles its native extension here too, even though the specs never open an
      # actual window -- same prerequisites as any app that depends on raintron.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Run rubocop
        run: bundle exec rubocop
